[package]
name = "tauri-plugin-shishi-reminder"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "System reminder and secure-token bridge for the Shishi To Do app"
links = "tauri-plugin-shishi-reminder"

[package.metadata.platforms.support.android]
level = "partial"
notes = "AlarmManager/NotificationManager and AndroidKeyStore AES-GCM token storage; requires real-device validation."

[package.metadata.platforms.support.ios]
level = "partial"
notes = "UNUserNotificationCenter and Security.framework Keychain implementation; requires Xcode and real-device validation."

[lib]
name = "tauri_plugin_shishi_reminder"
path = "src/lib.rs"

[build-dependencies]
tauri-plugin = { version = "2.7", features = ["build"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", default-features = false }

[target.'cfg(target_os = "ios")'.dependencies]
tauri = { version = "2.12", features = ["wry"] }

# Local plugin is consumed as a path dependency by the standalone Tauri shell.
[workspace]
