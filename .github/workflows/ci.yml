name: 'CI'

on:
  push:
    branches:
      - '**'
    tags:
      - '!**'
  pull_request:
    branches:
      - main
      - feat/**
      - minor

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # TypeScript type check (fastest, no caching needed)
  # ---------------------------------------------------------------------------
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: TypeScript check
        run: pnpm check

  # ---------------------------------------------------------------------------
  # Lint + Format check
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Prettier format check
        run: pnpm format:check

  # ---------------------------------------------------------------------------
  # Build all packages in parallel
  # ---------------------------------------------------------------------------
  build-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build todo-model
        run: pnpm --filter "@baicie/orbit" build

      - name: Build utils
        run: pnpm --filter "@baicie/orbit-utils" build

      - name: Build hooks
        run: pnpm --filter "@baicie/orbit-hooks" build

      - name: Build UI
        run: pnpm --filter "@baicie/orbit-ui" build

      - name: Build plugin-system
        run: pnpm --filter "@baicie/orbit-plugin-system" build

  # ---------------------------------------------------------------------------
  # Build all apps in parallel
  # ---------------------------------------------------------------------------
  build-apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Web
        run: pnpm build:web

      - name: Build Desktop
        run: pnpm build:desktop

      - name: Build Browser Extension
        run: pnpm build:browser-ext

      - name: Build Backend
        run: pnpm build:backend

      - name: Build Miniprogram
        run: pnpm build:miniprogram

      - name: Typecheck Mobile
        run: pnpm build:mobile

      - name: Compile VSCode Extension
        run: pnpm build:vscode-ext
