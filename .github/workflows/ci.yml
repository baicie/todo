name: 'ci'
on:
  push:
    branches:
      - '**'
    tags:
      - '!**'
  pull_request:
    branches:
      - main
      - feat/**
      - minor

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web
        run: pnpm build:web

      - name: Build desktop
        run: pnpm build:desktop

      - name: Build browser extension
        run: pnpm build:browser-ext

      - name: Build backend
        run: pnpm build:backend

      - name: Build miniprogram
        run: pnpm build:miniprogram

      - name: Typecheck mobile
        run: pnpm build:mobile

      - name: Compile vscode extension
        run: pnpm build:vscode-ext

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check
