name: browser

# Browser tests run the local-first web app against a production preview.
# The Axum API is intentionally NOT started: the web build defaults to local
# mode and does not call the API unless VITE_API_URL is set. API coverage lives
# in .github/workflows/api.yml. Add a Postgres service + `cargo run -p todo-api`
# here only when browser tests exercise optional cloud sync.

on:
  push:
    branches: [main]
    paths:
      - 'apps/app/**'
      - 'packages/**'
      - 'tests/e2e/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/browser.yml'
  pull_request:
    paths:
      - 'apps/app/**'
      - 'packages/**'
      - 'tests/e2e/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/browser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install app workspace
        run: pnpm install --frozen-lockfile

      - name: Build production app
        run: pnpm --filter @todo/app build

      # tests/e2e is deliberately a nested, self-contained pnpm workspace so
      # Playwright never becomes a dependency of the app workspace.
      - name: Install Playwright project
        run: pnpm --dir tests/e2e install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --dir tests/e2e exec playwright install --with-deps chromium

      - name: Run functional, PWA, keyboard and axe tests
        run: pnpm --dir tests/e2e test
        env:
          CI: true

      - name: Start production preview
        run: |
          pnpm --filter @todo/app preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          echo $! > /tmp/preview.pid
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4173/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/preview.log
          exit 1

      - name: Performance budget
        run: |
          node scripts/perf/benchmark.mjs --sizes=10000,100000 --iterations=1 --output=artifacts/perf-ci.json
          node scripts/perf/check-budget.mjs artifacts/perf-ci.json

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 14

      - name: Upload traces and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: tests/e2e/test-results
          retention-days: 14
