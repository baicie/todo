name: native

on:
  push:
    paths:
      - 'apps/native/**'
      - 'crates/native-core/**'
      - 'apps/app/**'
      - 'packages/**'
      - 'Cargo.toml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/native.yml'
  pull_request:
    paths:
      - 'apps/native/**'
      - 'crates/native-core/**'
      - 'apps/app/**'
      - 'packages/**'
      - 'Cargo.toml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/native.yml'

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p todo-native-core
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p todo-native-core --all-targets -- -D warnings

  tauri-check:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @todo/app build
      - run: cargo fmt --manifest-path apps/native/src-tauri/Cargo.toml -- --check
      - run: cargo check --manifest-path apps/native/src-tauri/Cargo.toml
      - run: cargo test --manifest-path apps/native/src-tauri/Cargo.toml --no-run
