name: API

on:
  push:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'apps/api/**'
      - 'crates/native-core/**'
      - 'db/postgres/**'
      - 'scripts/ops/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'Caddyfile'
      - 'docs/runbooks/**'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'apps/api/**'
      - 'crates/native-core/**'
      - 'db/postgres/**'
      - 'scripts/ops/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'Caddyfile'
      - 'docs/runbooks/**'
      - '.github/workflows/api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: todo
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: todo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todo -d todo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://todo:todo@127.0.0.1:5432/todo
      JWT_SECRET: ci-only-jwt-secret-that-is-longer-than-32-bytes
      APP_ENV: test
      BIND_ADDR: 127.0.0.1:8787
      CORS_ORIGINS: http://localhost:5173
      OPS_ADMIN_TOKEN: ci-only-operations-token-with-at-least-32-bytes
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.96
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/api
      - name: Format
        run: cargo fmt -p todo-api -- --check
      - name: Clippy
        run: cargo clippy -p todo-api --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test -p todo-api
      - name: Docker Compose config
        run: docker compose config --quiet
      - name: PostgreSQL integration tests
        run: |
          cargo test -p todo-api --test postgres_smoke -- --ignored --test-threads=1
          cargo test -p todo-api --test postgres_production -- --ignored --test-threads=1
          cargo test -p todo-api --test postgres_shared -- --ignored --test-threads=1
          # known_defect_* tests document tracked defects; run them explicitly.
          cargo test -p todo-api --test postgres_boundaries -- --ignored --skip known_defect_ --test-threads=1
          # Creates and drops temporary databases; the CI role is a superuser.
          cargo test -p todo-api --test postgres_migrations -- --ignored --test-threads=1
      - name: Operations CLI dry-run
        run: cargo run -p todo-api -- ops all --dry-run
      - name: Readiness smoke test
        run: |
          cargo run -p todo-api &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/readyz > /dev/null; then
              echo "API became ready"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to become ready"
          exit 1

  backup-restore:
    # Optional drill (docs/roadmap-v2/05-quality.md §4). It always runs on a
    # manual dispatch; on push and pull_request it runs only when the change
    # touches backup/restore scripts, migrations or the Compose file.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether the drill is needed
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          run=true
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base='' ;;
          esac
          # A new branch has no usable "before" commit; run the drill then.
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$base" HEAD |
              grep -qE '^(scripts/ops/|db/postgres/|docker-compose\.yml$|apps/api/src/(db|ops)\.rs$)'; then
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "backup/restore drill needed: $run"
      - name: Install Rust 1.96
        if: steps.scope.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - name: Cache Cargo
        if: steps.scope.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
      - name: PostgreSQL client tools
        if: steps.scope.outputs.run == 'true'
        run: |
          if ! command -v pg_dump > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          pg_dump --version
      - name: Backup and restore drill
        if: steps.scope.outputs.run == 'true'
        run: bash scripts/ops/backup-restore-test.sh --compose
