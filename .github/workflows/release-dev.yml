name: release-dev

# Dev-only tag release. The tag intentionally does not start with "v", so the
# production release-acceptance/release-desktop/release-web tag workflows are
# not triggered. Artifacts are unsigned QA/dev artifacts, not a production
# signing claim.
#
# Release contract (RC2-D.11 Phase E):
#   * the "context" job resolves and validates ONE release context (version,
#     tag, tag commit, build commit, app version, artifact version, channel) and
#     every later job consumes those outputs — no job derives an artifact name
#     or a version from the ref name or the dispatch input any more;
#   * the tag must exist, it must be a *-dev.* tag, the app version resolved
#     from the dev tauri config must equal the release version, and the tag
#     commit is the only commit the artifacts may be built from, so a manual
#     dispatch from a floating branch HEAD can never publish a different tree;
#   * every build job checks out needs.context.outputs.TagCommitSHA and proves
#     its HEAD is that commit before building;
#   * the publish job refuses to create the release unless every expected asset
#     exists, is non-empty and is covered by SHA256SUMS.txt, and it records a
#     release manifest (commits, versions, toolchain, asset hashes, run id);
#   * every third-party action is pinned to a 40-hex commit SHA recorded in
#     scripts/release/actions.lock.json. Permissions are read-only except on the
#     publishing job.
on:
  push:
    tags:
      - '*-dev.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing dev tag to publish, e.g. 0.0.1-dev.0'
        required: true
        default: '0.0.1-dev.0'
        type: string

permissions:
  contents: read

concurrency:
  group: release-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  TAURI_CLI_VERSION: '2.12.4'

jobs:
  context:
    name: Resolve and validate release context
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ReleaseVersion: ${{ steps.resolve.outputs.ReleaseVersion }}
      ReleaseTag: ${{ steps.resolve.outputs.ReleaseTag }}
      TagCommitSHA: ${{ steps.resolve.outputs.TagCommitSHA }}
      BuildCommitSHA: ${{ steps.resolve.outputs.BuildCommitSHA }}
      AppVersion: ${{ steps.resolve.outputs.AppVersion }}
      ArtifactVersion: ${{ steps.resolve.outputs.ArtifactVersion }}
      ReleaseChannel: ${{ steps.resolve.outputs.ReleaseChannel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve and validate the release context
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: node scripts/release/release-context.mjs resolve

  web:
    name: Build web distribution
    needs: context
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ needs.context.outputs.ReleaseVersion }}
      RELEASE_TAG: ${{ needs.context.outputs.ReleaseTag }}
      ARTIFACT_VERSION: ${{ needs.context.outputs.ArtifactVersion }}
      TAG_COMMIT_SHA: ${{ needs.context.outputs.TagCommitSHA }}
      BUILD_COMMIT_SHA: ${{ needs.context.outputs.BuildCommitSHA }}
      RELEASE_CHANNEL: ${{ needs.context.outputs.ReleaseChannel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.context.outputs.TagCommitSHA }}
          fetch-depth: 0
          fetch-tags: true

      - name: Assert the checkout is the release tag commit
        shell: bash
        run: node scripts/release/release-context.mjs assert-checkout

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.34.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @todo/app build

      - name: Archive web distribution under the artifact version
        shell: bash
        run: |
          set -euo pipefail
          name=$(node scripts/release/release-context.mjs artifact-name web-zip --version "$ARTIFACT_VERSION")
          sums=$(node scripts/release/release-context.mjs artifact-name web-sha256 --version "$ARTIFACT_VERSION")
          (cd apps/app/dist && zip -rq "../../../$name" .)
          sha256sum "$name" > "$sums"
          ls -l "$name" "$sums"

      - name: Record tool versions
        run: node scripts/release/release-context.mjs toolchain --platform web --out toolchain-web.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-web
          path: |
            shishi-web-*
            toolchain-web.json
          if-no-files-found: error

  windows:
    name: Build unsigned Windows NSIS (dev identity)
    needs: context
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ needs.context.outputs.ReleaseVersion }}
      RELEASE_TAG: ${{ needs.context.outputs.ReleaseTag }}
      ARTIFACT_VERSION: ${{ needs.context.outputs.ArtifactVersion }}
      TAG_COMMIT_SHA: ${{ needs.context.outputs.TagCommitSHA }}
      BUILD_COMMIT_SHA: ${{ needs.context.outputs.BuildCommitSHA }}
      RELEASE_CHANNEL: ${{ needs.context.outputs.ReleaseChannel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.context.outputs.TagCommitSHA }}
          fetch-depth: 0
          fetch-tags: true

      - name: Assert the checkout is the release tag commit
        shell: bash
        run: node scripts/release/release-context.mjs assert-checkout

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.34.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.96.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/native/src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Require the dev identity config
        shell: bash
        run: test -f apps/native/src-tauri/tauri.dev.conf.json

      - name: Build unsigned NSIS with the dev identity
        working-directory: apps/native
        run: pnpm dlx "@tauri-apps/cli@${{ env.TAURI_CLI_VERSION }}" build --bundles nsis --config src-tauri/tauri.dev.conf.json

      - name: Verify the installer carries the dev product identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedProduct = (node scripts/release/release-context.mjs config --field productName).Trim()
          $publisher = (node scripts/release/release-context.mjs config --field publisher).Trim()
          $installers = @(Get-ChildItem -Path 'apps/native/src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw "expected exactly one NSIS installer, found $($installers.Count)" }
          $info = (Get-Item -LiteralPath $installers[0].FullName).VersionInfo
          Write-Output "installer=$($installers[0].Name) ProductName=$($info.ProductName) CompanyName=$($info.CompanyName)"
          if ($info.ProductName -ne $expectedProduct) {
            throw "installer ProductName '$($info.ProductName)' is not the dev product '$expectedProduct'"
          }
          $company = "$($info.CompanyName)".Trim()
          if ($company -eq '') {
            if ($publisher -ne '') { throw "installer CompanyName is empty but the dev config declares publisher '$publisher'" }
            Write-Output 'CompanyName unset: the dev config declares no bundle.publisher, ProductName carries the dev identity'
          } elseif ($company -ne $expectedProduct -and $company -ne $publisher) {
            throw "installer CompanyName '$company' is neither the dev product '$expectedProduct' nor the publisher '$publisher'"
          }

      - name: Stage the installer under its artifact name
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = (node scripts/release/release-context.mjs artifact-name windows-nsis --version $env:ARTIFACT_VERSION).Trim()
          New-Item -ItemType Directory -Force -Path release-windows | Out-Null
          Copy-Item -Path (Join-Path 'apps/native/src-tauri/target/release/bundle/nsis' '*.exe') -Destination (Join-Path 'release-windows' $name) -Force
          Get-ChildItem release-windows | ForEach-Object { Write-Output "$($_.Name) $($_.Length) bytes" }

      - name: Record tool versions
        shell: bash
        run: node scripts/release/release-context.mjs toolchain --platform windows --out release-windows/toolchain-windows.json --tauri-cli "$TAURI_CLI_VERSION"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-windows
          path: |
            release-windows/*.exe
            release-windows/toolchain-windows.json
          if-no-files-found: error

  macos:
    name: Build macOS DMG (${{ matrix.label }})
    needs: context
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: arm64
            target: aarch64-apple-darwin
          - os: macos-14
            label: x64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ needs.context.outputs.ReleaseVersion }}
      RELEASE_TAG: ${{ needs.context.outputs.ReleaseTag }}
      ARTIFACT_VERSION: ${{ needs.context.outputs.ArtifactVersion }}
      TAG_COMMIT_SHA: ${{ needs.context.outputs.TagCommitSHA }}
      BUILD_COMMIT_SHA: ${{ needs.context.outputs.BuildCommitSHA }}
      RELEASE_CHANNEL: ${{ needs.context.outputs.ReleaseChannel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.context.outputs.TagCommitSHA }}
          fetch-depth: 0
          fetch-tags: true

      - name: Assert the checkout is the release tag commit
        shell: bash
        run: node scripts/release/release-context.mjs assert-checkout

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.34.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/native/src-tauri
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      - name: Require the dev identity config
        shell: bash
        run: test -f apps/native/src-tauri/tauri.dev.conf.json

      - name: Build DMG for ${{ matrix.label }} with the dev identity
        working-directory: apps/native
        run: pnpm dlx "@tauri-apps/cli@${{ env.TAURI_CLI_VERSION }}" build --target ${{ matrix.target }} --bundles dmg --config src-tauri/tauri.dev.conf.json

      - name: Normalize DMG name
        shell: bash
        run: |
          set -euo pipefail
          name=$(node scripts/release/release-context.mjs artifact-name macos-dmg --version "$ARTIFACT_VERSION" --arch "${{ matrix.label }}")
          sums=$(node scripts/release/release-context.mjs artifact-name macos-sha256 --version "$ARTIFACT_VERSION" --arch "${{ matrix.label }}")
          mkdir -p release-macos
          for file in apps/native/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg; do
            cp "$file" "release-macos/$name"
          done
          test -s "release-macos/$name"
          shasum -a 256 "release-macos/$name" > "release-macos/$sums"
          ls -l "release-macos/$name" "release-macos/$sums"

      - name: Verify DMG architecture and dev bundle identity
        shell: bash
        run: |
          set -euo pipefail
          name=$(node scripts/release/release-context.mjs artifact-name macos-dmg --version "$ARTIFACT_VERSION" --arch "${{ matrix.label }}")
          DMG="release-macos/$name"
          EXPECTED_ID=$(node scripts/release/release-context.mjs config --field identifier)
          MOUNT="$RUNNER_TEMP/shishi-dmg-verify"
          rm -rf "$MOUNT"; mkdir -p "$MOUNT"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT" >/dev/null
          trap 'hdiutil detach "$MOUNT" >/dev/null 2>&1 || true' EXIT
          APP=$(find "$MOUNT" -maxdepth 2 -name '*.app' -type d | head -1)
          test -n "$APP" || { echo "::error::no .app inside $DMG" >&2; exit 1; }
          BIN=$(find "$APP/Contents/MacOS" -maxdepth 1 -type f | head -1)
          test -n "$BIN" || { echo "::error::no Mach-O binary inside $APP" >&2; exit 1; }
          ARCHS=$(lipo -archs "$BIN")
          echo "DMG binary $BIN archs=$ARCHS"
          case "${{ matrix.target }}" in
            aarch64-*) test "$ARCHS" = "arm64" ;;
            x86_64-*) test "$ARCHS" = "x86_64" ;;
            *) echo "unexpected target" >&2; exit 1 ;;
          esac
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")
          echo "CFBundleIdentifier=$BUNDLE_ID expected=$EXPECTED_ID"
          test "$BUNDLE_ID" = "$EXPECTED_ID" || { echo "::error::CFBundleIdentifier $BUNDLE_ID != $EXPECTED_ID" >&2; exit 1; }
          SHORT_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          echo "CFBundleShortVersionString=$SHORT_VERSION expected=$RELEASE_VERSION"
          test "$SHORT_VERSION" = "$RELEASE_VERSION" || { echo "::error::CFBundleShortVersionString $SHORT_VERSION != $RELEASE_VERSION" >&2; exit 1; }
          hdiutil detach "$MOUNT" >/dev/null

      - name: Record tool versions
        shell: bash
        run: node scripts/release/release-context.mjs toolchain --platform "macos-${{ matrix.label }}" --out "release-macos/toolchain-macos-${{ matrix.label }}.json" --tauri-cli "$TAURI_CLI_VERSION"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-macos-${{ matrix.label }}
          path: release-macos/*
          if-no-files-found: error

  android:
    name: Build Android APK/AAB (split per ABI, dev identity)
    needs: context
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.context.outputs.ReleaseVersion }}
      RELEASE_TAG: ${{ needs.context.outputs.ReleaseTag }}
      ARTIFACT_VERSION: ${{ needs.context.outputs.ArtifactVersion }}
      TAG_COMMIT_SHA: ${{ needs.context.outputs.TagCommitSHA }}
      BUILD_COMMIT_SHA: ${{ needs.context.outputs.BuildCommitSHA }}
      RELEASE_CHANNEL: ${{ needs.context.outputs.ReleaseChannel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.context.outputs.TagCommitSHA }}
          fetch-depth: 0
          fetch-tags: true

      - name: Assert the checkout is the release tag commit
        shell: bash
        run: node scripts/release/release-context.mjs assert-checkout

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.34.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973'

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.96.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - run: pnpm install --frozen-lockfile

      - name: Require the dev identity config
        shell: bash
        run: test -f apps/native/src-tauri/tauri.dev.conf.json

      # The dev config must be in force for init as well as for build: init bakes
      # the identifier and the version into the generated Gradle project.
      - name: Initialize Android project with the dev identity
        working-directory: apps/native
        run: pnpm dlx "@tauri-apps/cli@${{ env.TAURI_CLI_VERSION }}" android init --ci --config src-tauri/tauri.dev.conf.json

      - name: Build split debug APK/AAB with the dev identity
        working-directory: apps/native
        run: pnpm dlx "@tauri-apps/cli@${{ env.TAURI_CLI_VERSION }}" android build --debug --apk --aab --split-per-abi --config src-tauri/tauri.dev.conf.json

      - name: Verify and rename Android artifacts
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${{ANDROID_HOME:-${{ANDROID_SDK_ROOT}}"
          AAPT2=$(ls -d "$SDK_DIR"/build-tools/*/aapt2 | sort -V | tail -1)
          test -x "$AAPT2" || { echo "::error::aapt2 not found under $SDK_DIR" >&2; exit 1; }
          EXPECTED_ID=$(node scripts/release/release-context.mjs config --field identifier)
          declare -A abi_of=( [app-arm64-debug.apk]=arm64-v8a [app-arm-debug.apk]=armeabi-v7a [app-x86-debug.apk]=x86 [app-x86_64-debug.apk]=x86_64 )
          declare -A token_of=( [arm64-v8a]=arm64 [armeabi-v7a]=arm [x86]=x86 [x86_64]=x86_64 )
          mkdir -p release-android
          find apps/native/src-tauri/gen/android/app/build/outputs -type f \
            \( -name '*.apk' -o -name '*.aab' \) -exec cp {} release-android/ \;
          shopt -s nullglob
          for apk in release-android/*.apk; do
            name=$(basename "$apk")
            abi="${{abi_of[$name]:-}"
            if [ -z "$abi" ]; then echo "::error::unexpected APK: $name" >&2; exit 1; fi
            unzip -l "$apk" | grep -q "lib/$abi/" || { echo "::error::APK $name lacks $abi" >&2; exit 1; }
            badging=$("$AAPT2" dump badging "$apk")
            pkg=$(printf '%s\n' "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)
            vname=$(printf '%s\n' "$badging" | sed -n "s/^package:.* versionName='\([^']*\)'.*/\1/p" | head -1)
            test "$pkg" = "$EXPECTED_ID" || { echo "::error::APK $name package id $pkg != $EXPECTED_ID" >&2; exit 1; }
            test "$vname" = "$RELEASE_VERSION" || { echo "::error::APK $name versionName $vname != $RELEASE_VERSION" >&2; exit 1; }
            target=$(node scripts/release/release-context.mjs artifact-name android-apk --version "$ARTIFACT_VERSION" --abi "${{token_of[$abi]}")
            mv "$apk" "release-android/$target"
            echo "verified APK $target abi=$abi package=$pkg versionName=$vname"
          done
          for aab in release-android/*.aab; do
            name=$(basename "$aab")
            base="${{name%.aab}.apk"
            abi="${{abi_of[$base]:-}"
            if [ -z "$abi" ]; then echo "::error::unexpected AAB: $name" >&2; exit 1; fi
            unzip -l "$aab" | grep -q "base/lib/$abi/" || { echo "::error::AAB $name lacks $abi" >&2; exit 1; }
            manifest=$(mktemp)
            unzip -p "$aab" base/manifest/AndroidManifest.xml > "$manifest"
            strings -a "$manifest" | grep -Fxq "$EXPECTED_ID" || { echo "::error::AAB $name package id != $EXPECTED_ID" >&2; exit 1; }
            strings -a "$manifest" | grep -Fxq "$RELEASE_VERSION" || { echo "::error::AAB $name versionName != $RELEASE_VERSION" >&2; exit 1; }
            target=$(node scripts/release/release-context.mjs artifact-name android-aab --version "$ARTIFACT_VERSION" --abi "${{token_of[$abi]}")
            mv "$aab" "release-android/$target"
            echo "verified AAB $target abi=$abi (protobuf manifest string pool)"
          done
          test "$(ls -1 release-android/*.apk | wc -l)" -eq 4 || { echo "::error::expected 4 split APKs, found $(ls -1 release-android/*.apk | wc -l)" >&2; exit 1; }
          test "$(ls -1 release-android/*.aab | wc -l)" -eq 4 || { echo "::error::expected 4 AABs, found $(ls -1 release-android/*.aab | wc -l)" >&2; exit 1; }
          ls -lh release-android

      - name: Record tool versions
        shell: bash
        run: node scripts/release/release-context.mjs toolchain --platform android --out release-android/toolchain-android.json --tauri-cli "$TAURI_CLI_VERSION"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-android
          path: release-android/*
          if-no-files-found: error

  release:
    name: Verify the artifact set and publish the dev pre-release
    needs: [context, web, windows, macos, android]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.context.outputs.ReleaseVersion }}
      RELEASE_TAG: ${{ needs.context.outputs.ReleaseTag }}
      APP_VERSION: ${{ needs.context.outputs.AppVersion }}
      ARTIFACT_VERSION: ${{ needs.context.outputs.ArtifactVersion }}
      TAG_COMMIT_SHA: ${{ needs.context.outputs.TagCommitSHA }}
      BUILD_COMMIT_SHA: ${{ needs.context.outputs.BuildCommitSHA }}
      RELEASE_CHANNEL: ${{ needs.context.outputs.ReleaseChannel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.context.outputs.TagCommitSHA }}
          fetch-depth: 0
          fetch-tags: true

      - name: Assert the checkout is the release tag commit
        shell: bash
        run: node scripts/release/release-context.mjs assert-checkout

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts

      - name: Remove legacy generic Android asset names
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only the pre-rename generic names are targeted; the Shishi-* assets
          # published for this tag are never touched.
          for name in app-arm-debug.apk app-arm-debug.aab app-arm64-debug.apk app-arm64-debug.aab app-x86-debug.apk app-x86-debug.aab app-x86_64-debug.apk app-x86_64-debug.aab; do
            gh release delete-asset "$RELEASE_TAG" "$name" --yes >/dev/null 2>&1 || true
          done

      - name: Pre-upload gate
        shell: bash
        run: node scripts/release/release-context.mjs verify-assets --artifacts-dir artifacts --stage pre

      - name: Write the release manifest
        shell: bash
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node scripts/release/release-context.mjs manifest --artifacts-dir artifacts

      - name: Write SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt ./SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish gate
        shell: bash
        run: node scripts/release/release-context.mjs verify-assets --artifacts-dir artifacts --stage final

      - name: Publish pre-release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.context.outputs.ReleaseTag }}
          name: Shishi ${{ needs.context.outputs.ReleaseVersion }}
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            ## Shishi ${{ needs.context.outputs.ReleaseVersion }}

            Dev pre-release built entirely by GitHub Actions from tag ${{ needs.context.outputs.ReleaseTag }} at commit ${{ needs.context.outputs.TagCommitSHA }}.

            ### Downloads

            - **macOS Apple Silicon**: `Shishi-${{ needs.context.outputs.ArtifactVersion }}-macos-arm64.dmg`
            - **macOS Intel**: `Shishi-${{ needs.context.outputs.ArtifactVersion }}-macos-x64.dmg`
            - **Windows x64**: `Shishi_${{ needs.context.outputs.ArtifactVersion }}_x64-setup.exe`
            - **Android** debug APK/AAB, split per ABI:
              armv7 (`android-arm`), arm64 (`android-arm64`), x86 (`android-x86`), x86_64 (`android-x86_64`).
            - **Web**: `shishi-web-${{ needs.context.outputs.ArtifactVersion }}.zip`
            - **Checksums**: `SHA256SUMS.txt` plus the macOS `.sha256` files.
            - **Provenance**: `release-manifest.json` (commit SHA, tag SHA, app version, channel, toolchain versions, asset sizes and sha256, workflow run id).

            Unsigned QA/dev artifacts. Windows notification actions remain gated;
            Windows platform is NOT_READY. This release does not merge PR #5 and
            is not a production release. Tauri updater signatures/latest.json are
            not published because no signing key is configured.
          files: |
            artifacts/*
          token: ${{ github.token }}
