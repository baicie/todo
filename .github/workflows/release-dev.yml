name: release-dev

# Dev-only tag release. The tag intentionally does not start with "v", so the
# production release-acceptance/release-desktop/release-web tag workflows are
# not triggered. Artifacts are unsigned QA/dev artifacts, not a production
# signing claim.
on:
  push:
    tags:
      - '*-dev.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Dev version/tag, e.g. 0.0.1-dev.0'
        required: true
        default: '0.0.1-dev.0'
        type: string

permissions:
  contents: write

concurrency:
  group: release-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Build web distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @todo/app build
      - name: Archive web distribution
        working-directory: apps/app/dist
        run: |
          zip -r "../../../shishi-web-${GITHUB_REF_NAME:-dev}.zip" .
          sha256sum "../../../shishi-web-${GITHUB_REF_NAME:-dev}.zip" > "../../../shishi-web-sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: |
            shishi-web-*.zip
            shishi-web-sha256.txt
          if-no-files-found: error

  windows:
    name: Build unsigned Windows NSIS
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build unsigned NSIS
        working-directory: apps/native/src-tauri
        run: pnpm dlx @tauri-apps/cli@2.12.4 build --bundles nsis
      - name: Upload NSIS
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: apps/native/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: Create GitHub dev pre-release
    needs: [web, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-web
          path: artifacts/web
      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: artifacts/windows
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "Publishing $VERSION from $GITHUB_SHA"
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "Shishi $VERSION" \
            --prerelease \
            --notes "Dev pre-release for $VERSION. Unsigned QA/dev artifacts; Windows notification actions remain gated and Windows platform is NOT_READY. This release does not merge PR #5 and is not a production release." \
            artifacts/web/*.zip \
            artifacts/web/*.txt \
            artifacts/windows/*.exe
