[package]
name = "todo-native-accounts"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "Native account registry and one-time legacy SQLite migration for Shishi"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.32.1", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v7"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
todo-native-core = { package = "todo-native-core", path = "../native-core" }
[features]
fault-injection = []
