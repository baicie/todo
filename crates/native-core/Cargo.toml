[package]
name = "todo-native-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "Pure SQLite domain repository for the Shishi local-first To Do app"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tempfile = "3"
